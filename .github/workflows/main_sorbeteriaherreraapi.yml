
name: CI/CD - Despliegue API .NET 10 a Azure App Service

on:
  push:
    branches:
      - "main"
  workflow_dispatch:

env:
  AZURE_WEBAPP_NAME: "SorbeteriaHerreraAPI"
  DOTNET_VERSION: "10.0.x"
  PROJECT_PATH: "HerreraSystemAPI/HerreraSystem.API.csproj"
  OUTPUT_PATH: "${{ github.workspace }}/publish"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código fuente
        uses: actions/checkout@v4

      - name: Configurar entorno .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restaurar dependencias
        run: dotnet restore ${{ env.PROJECT_PATH }}

      - name: Publicar (Release)
        run: dotnet publish ${{ env.PROJECT_PATH }} -c Release --no-restore -o ${{ env.OUTPUT_PATH }}

      - name: Desplegar hacia Azure WebApp
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ${{ env.OUTPUT_PATH }}